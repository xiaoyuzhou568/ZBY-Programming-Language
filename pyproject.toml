[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zby-language"
version = "0.2.0.dev0"
description = "ZBY programming language development interpreter"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
zby = "zby.interpreter:main"

[tool.setuptools.packages.find]
where = ["src"]
